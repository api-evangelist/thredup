name: ThredUp
description: >-
  ThredUp (NASDAQ: TDUP) is one of the world's largest online resale and consignment
  platforms for secondhand women's and kids' clothing, shoes, and accessories. Founded
  in 2009 and headquartered in Oakland, CA, it lets consumers buy and sell pre-owned
  fashion via mailed Clean Out Kits, and powers branded recommerce for 60+ retailers
  through its Resale-as-a-Service (RaaS) platform. ThredUp does not publish a public
  developer API or OpenAPI; RaaS integrations are arranged through its partner sales
  team, so this API Evangelist profile captures the company's public web, engineering,
  and policy surface rather than a documented API program.
